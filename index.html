<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuoteVoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Kufi+Arabic:wght@600;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the voice → receipt transformation is the hero; everything else is quiet support around it.
   The receipt stays paper in both themes and always reads left-to-right, like the real PDF. */
:root {
  --bg: #F2F6F4;
  --surface: #FFFFFF;
  --ink: #10201D;
  --muted: #566A66;
  --line: #DAE4E1;
  --brand: #0F766E;
  --brand-deep: #083F3B;
  --brand-soft: #D6F1EC;
  --amber: #E39B0B;
  --paper: #FFFDF7;
  --paper-ink: #1B2422;
  --paper-muted: #6B7471;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --lh: 1.6;
  --lh-head: 1.1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1311; --surface: #111C1A; --ink: #E6F0ED; --muted: #94A8A3; --line: #213330;
    --brand: #2CC3B0; --brand-deep: #06302C; --brand-soft: #0F2E2A; --amber: #F2B33A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1311; --surface: #111C1A; --ink: #E6F0ED; --muted: #94A8A3; --line: #213330;
  --brand: #2CC3B0; --brand-deep: #06302C; --brand-soft: #0F2E2A; --amber: #F2B33A;
  color-scheme: dark;
}
html[lang="ur"] { --f-display: 'Noto Nastaliq Urdu', serif; --f-body: 'Noto Nastaliq Urdu', serif; --lh: 2.15; --lh-head: 1.9; }
html[lang="ar"] { --f-display: 'Noto Kufi Arabic', sans-serif; --f-body: 'Noto Naskh Arabic', serif; --lh: 1.85; --lh-head: 1.45; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: var(--lh); }
h1, h2, h3 { font-family: var(--f-display); line-height: var(--lh-head); text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--brand); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--ink); text-decoration: none; }
.langs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.langs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .95rem; line-height: 1.6; }
.langs button[lang="ur"] { font-family: 'Noto Nastaliq Urdu', serif; font-size: .9rem; }
.langs button[lang="ar"] { font-family: 'Noto Kufi Arabic', sans-serif; font-size: .85rem; }
.langs button[lang="en"] { font-family: 'Figtree', sans-serif; }
.langs button[aria-pressed="true"] { background: var(--brand); color: #fff; }

/* Hero */
.hero { padding: 28px 0 8px; display: grid; gap: 18px; }
.eyebrow { color: var(--brand); font-weight: 700; font-size: .95rem; letter-spacing: .02em; }
html[lang="en"] .eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; }
.hero h1 { font-size: clamp(2.3rem, 6vw, 4.4rem); font-weight: 800; max-width: 16ch; }
html[lang="ur"] .hero h1 { font-weight: 700; font-size: clamp(2rem, 5vw, 3.5rem); }
.hero .sub { color: var(--muted); max-width: 62ch; font-size: 1.08rem; }
.cta-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--brand); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer; box-shadow: 0 6px 18px -8px rgba(15,118,110,.6); }
.btn:hover { filter: brightness(1.08); }
.note { color: var(--muted); font-size: .92rem; }

/* Demo */
.demo { margin: 28px 0 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: grid; gap: 18px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tabs .label { color: var(--muted); font-weight: 600; margin-inline-end: 6px; font-size: .95rem; }
.tab { border: 1px solid var(--line); background: var(--bg); padding: 8px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; line-height: 1.7; }
.tab svg { width: 18px; height: 18px; }
.tab[aria-selected="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.stage { display: grid; grid-template-columns: 1fr auto 1.15fr; gap: 18px; align-items: start; }
.stage .arrow { align-self: center; }
.say { display: grid; gap: 12px; align-content: start; }
.tag { font-size: .85rem; font-weight: 700; color: var(--muted); }
.bubble { background: var(--brand-deep); color: #EAF7F4; border-radius: 22px; border-start-start-radius: 6px; padding: 18px 20px; font-size: 1.12rem; display: grid; gap: 14px; }
html[lang="ur"] .bubble { font-size: 1.05rem; }
.wave { display: flex; gap: 3px; align-items: center; height: 26px; direction: ltr; }
.wave i { display: block; width: 4px; border-radius: 2px; background: #5EEAD4; height: 30%; animation: wave 1.1s ease-in-out infinite; }
@keyframes wave { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
.mic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: #E0F2EF; color: var(--brand-deep); flex: none; }
.wave-row { display: flex; align-items: center; gap: 10px; }
.arrow { display: grid; place-items: center; gap: 4px; color: var(--brand); text-align: center; font-size: .85rem; font-weight: 700; }
.arrow svg { width: 44px; height: 44px; }
html[dir="rtl"] .arrow svg { transform: scaleX(-1); }

/* Receipt (always LTR, like the real PDF) */
.receipt { direction: ltr; text-align: left; font-family: var(--f-mono); background: var(--paper); color: var(--paper-ink); border-radius: 14px 14px 0 0; padding: 18px 18px 26px; box-shadow: 0 18px 40px -22px rgba(8,63,59,.55), 0 0 0 1px rgba(16,32,29,.06); position: relative; font-size: .82rem; line-height: 1.5; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: linear-gradient(-45deg, transparent 7px, var(--paper) 0) 0 0/14px 10px repeat-x, linear-gradient(45deg, transparent 7px, var(--paper) 0) 0 0/14px 10px repeat-x; }
.r-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--paper-ink); padding-bottom: 8px; margin-bottom: 8px; }
.r-title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.15rem; letter-spacing: .06em; }
.r-meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; color: var(--paper-muted); margin-bottom: 10px; }
.r-meta b { color: var(--paper-ink); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; color: var(--paper-muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; padding: 4px 0; border-bottom: 1px dashed #C9CFCD; }
td { padding: 6px 0; border-bottom: 1px dashed #E2E6E4; vertical-align: top; }
th.n, td.n { text-align: right; white-space: nowrap; padding-left: 10px; }
td .unit { color: var(--paper-muted); font-size: .72rem; }
.group td { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: #0F766E; font-weight: 600; padding-top: 10px; border-bottom: 0; }
.r-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-top: 8px; border-top: 2px solid var(--paper-ink); font-weight: 600; font-size: 1rem; }
.r-total strong { font-size: 1.15rem; }
.r-total .bar { display: block; height: 4px; width: 56px; background: #E39B0B; border-radius: 2px; margin-top: 4px; }
.r-words { color: var(--paper-muted); font-style: italic; margin-top: 6px; font-size: .75rem; }
.r-foot { display: flex; justify-content: space-between; margin-top: 12px; color: var(--paper-muted); font-size: .7rem; }
.rows-in tr { animation: rowIn .45s cubic-bezier(.2,.7,.2,1) backwards; }
@keyframes rowIn { from { opacity: .1; transform: translateY(6px); } }

/* Sections */
section { padding: 56px 0 8px; }
.sec-head { display: grid; gap: 8px; margin-bottom: 22px; max-width: 70ch; }
.sec-head h2 { font-size: clamp(1.6rem, 3.6vw, 2.4rem); font-weight: 800; }
html[lang="ur"] .sec-head h2 { font-weight: 700; }
.sec-head p { color: var(--muted); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: step; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 8px; align-content: start; }
.step .num { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 2.4rem; line-height: 1; color: var(--amber); }
.step h3 { font-size: 1.3rem; }
.step p { color: var(--muted); }

.trade-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 12px; align-content: start; }
.tcard header { display: flex; align-items: center; gap: 12px; }
.ticon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.ticon svg { width: 24px; height: 24px; }
.tcard h3 { font-size: 1.25rem; }
.tcard .count { color: var(--muted); font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; justify-content: flex-start; }
html[dir="rtl"] .chips { justify-content: flex-end; }
.chip { font-family: 'Figtree', sans-serif; font-size: .82rem; line-height: 1.4; padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.chip.more { color: var(--brand); border-color: var(--brand); background: transparent; font-weight: 600; }

.money { background: var(--brand-deep); color: #EAF7F4; border-radius: 24px; padding: 28px 22px; display: grid; gap: 18px; }
.money h2 { font-size: clamp(1.5rem, 3.4vw, 2.2rem); }
.money p { color: #B5D8D2; }
.pairs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pair { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.pair .said { font-size: 1.05rem; }
.pair .num { font-family: var(--f-mono); color: #FBD38D; font-size: 1.05rem; direction: ltr; text-align: start; font-variant-numeric: tabular-nums; }
html[dir="rtl"] .pair .num { text-align: right; }

.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.feat { padding: 18px 4px; border-top: 2px solid var(--line); display: grid; gap: 6px; align-content: start; }
.feat svg { width: 26px; height: 26px; color: var(--brand); }
.feat h3 { font-size: 1.15rem; }
.feat p { color: var(--muted); }

.faq { display: grid; gap: 10px; max-width: 820px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; }
summary { cursor: pointer; font-weight: 700; padding: 12px 0; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--brand); font-weight: 800; }
details[open] summary::after { content: "–"; }
details p { color: var(--muted); padding-bottom: 14px; }

.join { margin: 56px 0 0; background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #fff; border-radius: 24px; padding: 32px 24px; display: grid; gap: 12px; }
.join h2 { font-size: clamp(1.6rem, 3.6vw, 2.4rem); }
.join p { color: #D4EEEA; }
.contact { display: inline-flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(255,255,255,.12); border-radius: 14px; padding: 10px 16px; width: fit-content; }
.contact a { color: #fff; font-family: 'Figtree', sans-serif; font-weight: 700; direction: ltr; }
footer { padding: 28px 0 40px; color: var(--muted); font-size: .9rem; display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
.foot-links { display: flex; gap: 18px; flex-wrap: wrap; }
.socials { display: flex; gap: 10px; flex-wrap: wrap; }
.social { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #fff; color: var(--brand-deep); font-family: 'Figtree', sans-serif; font-weight: 700; text-decoration: none; }
.social svg { width: 18px; height: 18px; }
.social:hover { filter: brightness(.95); }

@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; }
  .arrow svg { transform: rotate(90deg); }
  html[dir="rtl"] .arrow svg { transform: rotate(90deg); }
  .steps, .trade-cards, .features { grid-template-columns: 1fr; }
  .pairs { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 420px) { .pairs { grid-template-columns: 1fr; } body { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) {
  .wave i, .rows-in tr { animation: none; }
}
/* Launch banner */
.launch { background: var(--brand-deep); color: #EAF7F4; }
.launch .wrap { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; text-align: center; font-size: .95rem; }
.launch .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(242,165,22,.25); flex: none; }
.launch strong { color: #FBD38D; }
.launch a { color: #fff; font-weight: 700; }
</style>
</head>

const ICONS = {
  solar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="10" rx="1"/><path d="M3 15h18M9 10v10M15 10v10M12 2v3M5.6 4.6l1.4 1.4M18.4 4.6 17 6"/></svg>',

    contactLabel: 'للحصول على التطبيق:', privacy: 'سياسة الخصوصية'
  }
};

let lang = 'en';
let trade = 'solar';
try { const saved = localStorage.getItem('qv-lang2'); if (saved && T[saved]) lang = saved; } catch (e) {}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function money(n, region) {
  return region === 'pk' ? 'Rs ' + n.toLocaleString('en-IN') : 'AED ' + n.toLocaleString('en-US');
}

function renderReceipt(animate) {
  const region = lang === 'ar' ? 'gulf' : 'pk';
  const q = QUOTES[region][trade];
  const row = (r) => `<tr><td>${esc(r[0])}<br><span class="unit">${r[1]} × ${money(r[3], region)} ${r[2]}</span></td><td class="n">${r[1]}</td><td class="n">${money(r[1] * r[3], region)}</td></tr>`;
  const total = [...q.materials, ...q.labour].reduce((s, r) => s + r[1] * r[3], 0);
  $('#receipt').innerHTML = `
    <div class="r-head"><span class="r-title">QUOTATION</span><span>${q.no}</span></div>
    <div class="r-meta"><span>Customer</span><b>${esc(q.customer)}</b><span>Site</span><b>${esc(q.site)}</b></div>
    <table>
      <thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Amount</th></tr></thead>
      <tbody class="${animate ? 'rows-in' : ''}">
        <tr class="group"><td colspan="3">Materials</td></tr>
        ${q.materials.map(row).join('')}
        <tr class="group"><td colspan="3">Labour</td></tr>
        ${q.labour.map(row).join('')}
      </tbody>
    </table>
    <div class="r-total"><span>Total<span class="bar"></span></span><strong>${money(total, region)}</strong></div>
    <div class="r-words">${esc(q.words)}</div>
    <div class="r-foot"><span>Valid for 7 days</span><span>Sent on WhatsApp ✓</span></div>`;
  if (animate) document.querySelectorAll('.rows-in tr').forEach((tr, i) => { tr.style.animationDelay = (i * 70) + 'ms'; });
}

function render(animate) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.querySelectorAll('[data-t]').forEach((el) => { const v = t[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.querySelectorAll('.tab').forEach((b) => {
    b.innerHTML = ICONS[b.dataset.trade] + `<span>${esc(t[b.dataset.trade])}</span>`;
    b.setAttribute('aria-selected', String(b.dataset.trade === trade));
    b.tabIndex = b.dataset.trade === trade ? 0 : -1;
  });
  $('#spoken').textContent = t.spoken[trade];
  renderReceipt(animate);

  $('#trade-cards').innerHTML = ['solar', 'electric', 'plumber'].map((k) => {
    const shown = TRADE_ITEMS[k];
    return `<article class="tcard"><header><span class="ticon">${ICONS[k]}</span><div><h3>${esc(t[k])}</h3><span class="count">${esc(t.items(TRADE_TOTAL[k]))}</span></div></header>
      <div class="chips">${shown.map((n) => `<span class="chip">${esc(n)}</span>`).join('')}<span class="chip more">${esc(t.more(TRADE_TOTAL[k] - shown.length))}</span></div></article>`;
  }).join('');

  $('#pairs').innerHTML = t.pairs.map(([said, num]) => `<div class="pair"><span class="said" ${/[a-z]/i.test(said) ? 'lang="ur-Latn" dir="ltr"' : ''}>${esc(said)}</span><span class="num">${esc(num)}</span></div>`).join('');
  $('#features').innerHTML = t.feats.map(([icon, h, p]) => `<div class="feat">${ICONS[icon]}<h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('');
  $('#faq').innerHTML = t.faq.map(([q, a], i) => `<details id="faq-${i}"${i === 0 ? ' open' : ''}><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
  document.title = lang === 'ur' ? 'QuoteVoice — بولیں، کوٹیشن تیار' : lang === 'ar' ? 'QuoteVoice — عرض السعر بالصوت' : 'QuoteVoice';
}

/* Waveform bars (static heights, gently animated). */
$('#wave').innerHTML = Array.from({ length: 28 }, (_, i) => {
  const h = 30 + Math.round(Math.abs(Math.sin(i * 1.7)) * 70);
  return `<i style="height:${h}%;animation-delay:${(i % 7) * 0.12}s"></i>`;
}).join('');

document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('qv-lang2', lang); } catch (e) {}
  render(true);
}));
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { trade = b.dataset.trade; render(true); }));
$('.tabs').addEventListener('keydown', (e) => {
  const order = ['solar', 'electric', 'plumber'];
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const rtl = document.documentElement.dir === 'rtl';
  const step = (e.key === 'ArrowRight') !== rtl ? 1 : -1;
  trade = order[(order.indexOf(trade) + step + 3) % 3];
  render(true);
  document.querySelector(`.tab[data-trade="${trade}"]`).focus();
});

render(false);
</script>
</body>
</html>
